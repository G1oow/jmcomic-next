name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r' | head -n1)
          version_code=$(sed -n 's/^VERSION_CODE=//p' version.properties | tr -d '\r' | head -n1)
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "::error::version.properties 缺少 VERSION_NAME 或 VERSION_CODE"
            exit 1
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"
          echo "版本 $version_name (versionCode $version_code)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Use official Maven repositories
        run: |
          mkdir -p "$GRADLE_USER_HOME/init.d"
          {
            echo 'settingsEvaluated { settings ->'
            echo '  settings.pluginManagement.repositories.clear()'
            echo '  settings.pluginManagement.repositories.gradlePluginPortal()'
            echo '  settings.pluginManagement.repositories.google()'
            echo '  settings.pluginManagement.repositories.mavenCentral()'
            echo '  settings.dependencyResolutionManagement.repositories.clear()'
            echo '  settings.dependencyResolutionManagement.repositories.google()'
            echo '  settings.dependencyResolutionManagement.repositories.mavenCentral()'
            echo '}'
          } > "$GRADLE_USER_HOME/init.d/ci-repos.gradle"
          cat "$GRADLE_USER_HOME/init.d/ci-repos.gradle"

      - name: Install Android SDK packages
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          JM_RELEASE_KEYSTORE_BASE64: ${{ secrets.JM_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$JM_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 JM_RELEASE_KEYSTORE_BASE64 secret，无法产出正式签名包"
            exit 1
          fi
          umask 077
          printf '%s' "$JM_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jm-release.jks"

      - name: Assemble release
        env:
          JM_RELEASE_STORE_FILE: ${{ runner.temp }}/jm-release.jks
          JM_RELEASE_STORE_PASSWORD: ${{ secrets.JM_RELEASE_STORE_PASSWORD }}
          JM_RELEASE_KEY_ALIAS: ${{ secrets.JM_RELEASE_KEY_ALIAS }}
          JM_RELEASE_KEY_PASSWORD: ${{ secrets.JM_RELEASE_KEY_PASSWORD }}
          JM_REQUIRE_RELEASE_SIGNING: 'true'
        run: |
          gradle :app:assembleRelease \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --stacktrace --console=plain

      # 只在 main 或 v* 标签上发布，分支上的验证构建不会产生 Release 和标签。
      - name: Publish GitHub release
        if: github.ref_type == 'tag' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "使用安装包 $apk"

          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "版本 \`$TAG\`（versionCode $VERSION_CODE）"
            echo
            echo "APK 由 GitHub Actions 使用项目自有密钥签名，可直接下载覆盖安装；"
            echo "应用内的「检查更新」会读取这个 Release。"
          } > "$notes"

          changelog=""
          if [ -f CHANGELOG.md ]; then changelog=CHANGELOG.md; elif [ -f CHANGELOG ]; then changelog=CHANGELOG; fi
          if [ -n "$changelog" ] && grep -qE "^#+ *v${VERSION_NAME}( |\r?$)" "$changelog"; then
            echo >> "$notes"
            awk -v pat="^#+ *v${VERSION_NAME}( |\r?$)" '
              sub(/\r$/, "")
              $0 ~ pat { inside = 1; next }
              inside && /^#+ / { exit }
              inside { print }
            ' "$changelog" >> "$notes"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明并覆盖 APK"
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes" --latest
            gh release upload "$TAG" "$apk" --clobber
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "$TAG" "$apk" --title "$TAG" --notes-file "$notes" --latest --verify-tag
          else
            gh release create "$TAG" "$apk" --title "$TAG" --notes-file "$notes" --latest --target "$GITHUB_SHA"
          fi
          echo "已发布 $TAG"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jm-mobile-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
